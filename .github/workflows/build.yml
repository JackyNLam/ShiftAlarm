name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Empty when the KEYSTORE_BASE64 secret is not configured; set from the secret when it is.
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Platform 35 matches compileSdk. AGP auto-downloads any extra
          # build-tools it needs (licenses are accepted by setup-android).
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Decode signing keystore (if configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk