name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GitHub does not inject secrets into the job environment automatically; each one
  # must be mapped here explicitly. The "ci" signing config in app/build.gradle.kts
  # reads all four via System.getenv(...): it fails fast if KEYSTORE_PATH is set but
  # any of the other three is blank (missing or unmapped secret).
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
        # Optional supply-chain check. continue-on-error: the action downloads reference
        # data from gradle.org, which can transiently fail on GitHub runners (seen:
        # connect ETIMEDOUT to Cloudflare-fronted hosts) and would otherwise block every
        # build. The wrapper jar is the repo's own committed file, and Gradle itself
        # verifies the distribution via distributionSha256Sum in gradle-wrapper.properties.
        continue-on-error: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Platform 35 matches compileSdk. AGP auto-downloads any extra
          # build-tools it needs (licenses are accepted by setup-android).
          # setup-android@v3 splits this input on SPACES and runs one
          # sdkmanager call per token (src/main.ts). Neither commas nor
          # newlines separate packages: sdkmanager then looks for one bogus
          # package id ("Failed to find package ...").
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Decode signing keystore (if configured)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" >> "$GITHUB_ENV"

      - name: Warn when builds will use an ephemeral debug key
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::No KEYSTORE_BASE64 secret set. APKs are signed with a fresh runner debug key, so installing them over a previous build fails with a signature conflict. Add the keystore secrets (see README, CI Build section) to make updates install over old versions."

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk